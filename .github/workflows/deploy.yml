name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          VITE_BASE_PATH: /GUI-Cam/
          VITE_STREAM_URL: ${{ vars.VITE_STREAM_URL }}
          VITE_HLS_LOW_LATENCY: ${{ vars.VITE_HLS_LOW_LATENCY }}
          VITE_ONVIF_API_URL: ${{ vars.VITE_ONVIF_API_URL }}
          VITE_ONVIF_URI: ${{ secrets.VITE_ONVIF_URI }}
          VITE_ONVIF_USER: ${{ secrets.VITE_ONVIF_USER }}
          VITE_ONVIF_PASSWORD: ${{ secrets.VITE_ONVIF_PASSWORD }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
